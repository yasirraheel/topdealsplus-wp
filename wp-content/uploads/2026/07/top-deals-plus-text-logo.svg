<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Top Deals Plus</title>
  <desc id="desc">Text-only Top Deals Plus wordmark designed for clear contrast on dark and light backgrounds.</desc>
  <defs>
    <linearGradient id="tdpTextGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#d9fff9"/>
    </linearGradient>
    <filter id="tdpShadow" x="-8%" y="-35%" width="116%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#07111f" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#0fd8cb" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="180" fill="none"/>
  <g filter="url(#tdpShadow)">
    <text x="30" y="116"
          font-family="Inter, Manrope, Arial, Helvetica, sans-serif"
          font-size="82"
          font-weight="850"
          letter-spacing="-2.4"
          stroke="#07111f"
          stroke-width="4"
          stroke-linejoin="round"
          paint-order="stroke fill"
          fill="url(#tdpTextGradient)">Top Deals Plus</text>
  </g>
  <path d="M34 142H292" stroke="#18d6c8" stroke-width="8" stroke-linecap="round"/>
  <path d="M302 142H382" stroke="#ff4655" stroke-width="8" stroke-linecap="round"/>
</svg>
